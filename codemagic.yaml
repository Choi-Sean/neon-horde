# NEON HORDE — Codemagic CI (Mac 없이 iOS/Android 클라우드 빌드)
# Unity 6000.0 LTS (6000.0.82f1). Codemagic 맥 머신에 해당 버전이 없으면 빌드 스텝에서 설치한다.
#
# 처음 한 번 준비 (Codemagic 웹 UI):
#   Teams → Integrations
#     - App Store Connect: API 키를 "NeonHorde ASC" 이름으로 등록 (Issuer ID + Key ID + .p8)
#   앱 → Environment variables (그룹으로 묶기):
#     - group "unity":
#         Unity Pro/Plus  -> UNITY_SERIAL, UNITY_EMAIL, UNITY_PASSWORD
#         Unity Personal  -> UNITY_LICENSE (.ulf 파일 전체 내용을 값으로)  ※ 아래 문서 참고
#         https://docs.codemagic.io/knowledge-others/manual-unity-license-activation/
#     - group "android_keystore":
#         CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_ALIAS_PASSWORD
#     - group "google_play":
#         GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play Console 서비스 계정 JSON)
#   앱 → Code signing → Android: keystore 업로드 후 reference 이름 "neonhorde_keystore"

definitions:
  unity_version: &unity_version "6000.0.82f1"
  unity_changeset: &unity_changeset "2fb0dae735e1"

  install_unity: &install_unity
    name: Ensure Unity is installed
    script: |
      set -e
      UNITY_VERSION="6000.0.82f1"
      UNITY_CHANGESET="2fb0dae735e1"
      UNITY_APP="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app"
      HUB="/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"
      : "${UNITY_MODULES:=--module ios}"
      if [ ! -x "${UNITY_APP}/Contents/MacOS/Unity" ]; then
        echo "Installing Unity ${UNITY_VERSION} (modules: ${UNITY_MODULES}) ..."
        "$HUB" -- --headless install --architecture arm64 \
          --version "$UNITY_VERSION" --changeset "$UNITY_CHANGESET" \
          $UNITY_MODULES || true
      else
        echo "Unity ${UNITY_VERSION} already present (cache hit). Adding modules ${UNITY_MODULES} ..."
        "$HUB" -- --headless install-modules --version "$UNITY_VERSION" $UNITY_MODULES || true
      fi
      test -x "${UNITY_APP}/Contents/MacOS/Unity" || { echo "Unity install failed"; exit 1; }
      echo "UNITY_HOME=${UNITY_APP}" >> "$CM_ENV"
      echo "UNITY_BIN=${UNITY_APP}/Contents/MacOS/Unity" >> "$CM_ENV"

  activate_license: &activate_license
    name: Activate Unity license
    script: |
      set -e
      if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
        echo "!! Set UNITY_EMAIL and UNITY_PASSWORD (Unity account, 2FA OFF) in the 'unity' env group."
        echo "!! Unity Pro/Plus also set UNITY_SERIAL. Unity Personal needs only email+password."
        exit 1
      fi
      if [ -n "$UNITY_SERIAL" ]; then
        echo "Activating Unity Pro/Plus via serial..."
        "$UNITY_BIN" -batchmode -nographics -quit -logFile - \
          -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
      else
        echo "Activating Unity Personal via account (no serial)..."
        "$UNITY_BIN" -batchmode -nographics -quit -logFile - \
          -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
      fi

  return_license: &return_license
    name: Return Unity license
    script: |
      "$UNITY_BIN" -batchmode -nographics -quit -returnlicense -logFile - || true

workflows:

  # ------------------------------------------------------------------ Android
  android:
    name: NEON HORDE · Android (AAB)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - unity
        - android_keystore
        - google_play
      vars:
        PACKAGE_NAME: "com.bitbyte.neonhorde"
        UNITY_MODULES: "--module android --childModules"
      android_signing:
        - neonhorde_keystore
    cache:
      cache_paths:
        - $HOME/Library/Unity/cache
        - $CM_BUILD_DIR/Library
        - /Applications/Unity/Hub/Editor
    scripts:
      - *install_unity
      - *activate_license
      - name: Build Android App Bundle
        script: |
          export APP_VERSION_NAME="1.0.$PROJECT_BUILD_NUMBER"
          export BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          "$UNITY_BIN" -batchmode -nographics -quit -logFile - \
            -projectPath . \
            -executeMethod NeonHorde.EditorTools.BuildScript.BuildAndroid
      - *return_license
    artifacts:
      - build/android/*.aab
      - build/android/*.apk
      - "**/Editor.log"
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - choi.sean1991@gmail.com

  # ------------------------------------------------------------------ iOS
  ios:
    name: NEON HORDE · iOS (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: NeonHorde ASC
    environment:
      groups:
        - unity
      vars:
        BUNDLE_ID: "com.bitbyte.neonhorde"
        XCODE_PROJECT: "build/ios/Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
        UNITY_MODULES: "--module ios"
    cache:
      cache_paths:
        - $HOME/Library/Unity/cache
        - $CM_BUILD_DIR/Library
        - /Applications/Unity/Hub/Editor
    scripts:
      - *install_unity
      - *activate_license
      - name: Build Unity iOS Xcode project
        script: |
          export APP_VERSION_NAME="1.0.$PROJECT_BUILD_NUMBER"
          export BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          "$UNITY_BIN" -batchmode -nographics -quit -logFile - \
            -projectPath . \
            -executeMethod NeonHorde.EditorTools.BuildScript.BuildIOS
      - *return_license
      - name: Install CocoaPods
        script: |
          cd build/ios && pod install || true
      - name: Create signing files via App Store Connect API
        script: |
          app-store-connect create-bundle-id "$BUNDLE_ID" --name "NEON HORDE" || true
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd build/ios
          agvtool new-version -all "$PROJECT_BUILD_NUMBER" || true
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "**/Editor.log"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - choi.sean1991@gmail.com
